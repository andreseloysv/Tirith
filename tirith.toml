# Tirith's own checks: what the merge queue runs before a lane reaches main.
deploy = "none"
roadmap = "docs/TODO.md"

[[pipelines]]
id = "ci"
name = "CI"

[[pipelines.stages]]
name = "build"
run = "cargo build -q -p tirith && cargo clippy -q -p tirith -- -D warnings"

# The daemon stays small on purpose: past 3500 lines, simplify before adding.
[[pipelines.stages]]
name = "size"
run = "n=$(cat rust/tirith/src/*.rs | wc -l); echo \"rust/tirith/src: $n lines (limit 3500)\"; test \"$n\" -le 3500"

[[pipelines.stages]]
name = "app"
run = "cargo check -q -p tirith-app"
paths = ["app/**", "rust/tirith/ui/**", "Cargo.toml"]
