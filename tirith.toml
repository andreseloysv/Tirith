# Tirith's own checks: what the merge queue runs before a lane reaches main.
deploy = "none"
roadmap = "docs/TODO.md"

[[pipelines]]
id = "ci"
name = "CI"

[[pipelines.stages]]
name = "build"
run = "cargo build -q -p tirith && cargo clippy -q -p tirith -- -D warnings"

# The daemon stays small on purpose: past the limit, simplify before adding.
[[pipelines.stages]]
name = "size"
run = "cargo fmt --check -p tirith && n=$(find rust/tirith/src -name '*.rs' -exec cat {} + | wc -l); echo \"rust/tirith/src: $n lines (limit 6000)\"; test \"$n\" -le 6000"

[[pipelines.stages]]
name = "app"
run = "cargo check -q -p tirith-app"
paths = ["app/**", "rust/tirith/ui/**", "Cargo.toml"]
