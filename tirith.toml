# Tirith's own checks: what the merge queue runs before a lane reaches main.
deploy = "none"
roadmap = "docs/TODO.md"

[[pipelines]]
id = "ci"
name = "CI"

[[pipelines.stages]]
name = "build"
run = "cargo build -q -p tirith && cargo clippy -q -p tirith -- -D warnings"

[[pipelines.stages]]
name = "test"
run = "cargo test -q -p tirith"

# Small files on purpose: every code file that is not a test has 100 lines or less (docs/BOTS.md, part 0).
# main's copy of the check runs, so a branch cannot loosen the rule for itself.
[[pipelines.stages]]
name = "size"
run = "git show main:tools/size.sh | sh"

[[pipelines.stages]]
name = "app"
run = "cargo check -q -p tirith-app"
paths = ["app/**", "rust/tirith/ui/**", "Cargo.toml"]
