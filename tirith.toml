# Tirith's own pipelines. Format: docs/CONTRACT-manifest.md
deploy = "none"
roadmap = "docs/TODO.md"
deadline = "2026-11-04T21:00:00-05:00"
include = ["tirith-port.toml"]  # pipelines that do not block merges

[[pipelines]]
id = "ci"
name = "CI"

[[pipelines.stages]]
name = "build"
run = "cd collector && uv run -q python -m compileall -q tirith && for f in ../web/js/*.js; do node --check \"$f\" || exit 1; done"

[[pipelines.stages]]
name = "test"
run = "cd collector && uv run -q pytest -q -n auto --maxprocesses 8"

[[pipelines.stages]]
name = "rust-test"
kind = "test"
run = "cargo test -q -p tirith-app"
