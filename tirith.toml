# Tirith's own pipelines. Format: docs/CONTRACT-manifest.md
deploy = "none"
roadmap = "docs/TODO.md"
deadline = "2026-11-04T21:00:00-05:00"

[[pipelines]]
id = "ci"
name = "CI"

[[pipelines.stages]]
name = "build"
run = "cd collector && uv run -q python -m compileall -q tirith && for f in ../web/js/*.js; do node --check \"$f\" || exit 1; done && cd .. && cargo build -q -p tirith-core -p tirith-cli"

[[pipelines.stages]]
name = "test"
run = "cd collector && uv run -q pytest -q"

[[pipelines.stages]]
name = "rust-test"
kind = "test"
run = "cargo test -q --workspace"

[[pipelines.stages]]
name = "parity"
kind = "test"
run = "cargo build -q -p tirith-cli && cd collector && uv run -q python ../scripts/parity/run.py"
