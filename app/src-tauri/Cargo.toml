[package]
name = "tirith-app"
version = "0.2.1"
description = "NeoBot desktop app: a window on the local NeoBot daemon"
edition = "2021"
license = "MIT"

[lib]
name = "tirith_app_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
toml = "0.8"
serde_json = "1"
tirith-signin = { path = "../signin" }
