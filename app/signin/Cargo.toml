[package]
name = "tirith-signin"
version = "0.2.1"
description = "NeoBot app: sign in to a team server with the company's identity provider (Authorization Code with PKCE, RFC 8252)"
edition = "2021"
license = "MIT"

[dependencies]
reqwest = { version = "0.12", default-features = false, features = ["blocking", "json", "rustls-tls"] }
serde_json = "1"
sha2 = "0.10"
base64 = "0.22"
rand = "0.8"

[[test]]
name = "flow"
path = "tests/flow.test.rs"
