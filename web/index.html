<title>Tirith</title>
<meta name="color-scheme" content="light dark">
<script>/* theme before first paint: localStorage "tirith.theme" = light | dark (anything else is System) */
try { var q = location.search.match(/theme=(light|dark)/); var t = q ? q[1] : localStorage.getItem('tirith.theme'); if (t === 'light' || t === 'dark') document.documentElement.dataset.theme = t; } catch (e) {}
</script>
