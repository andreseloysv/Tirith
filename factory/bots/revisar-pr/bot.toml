# A bot template: what «Desde plantilla» makes. Its folder's name is its skill's name.
# Its task names no {title} or {text}: what a pull request says stays inside the block marked as data from outside.
name = "Review new PRs"
start = "I review every new PR and tell you here, without posting anything. To connect me: in Routines press «Make the address», copy the address and add it in GitHub (the repository's Settings › Webhooks) with Content type application/json and only the Pull requests event. For private repositories I need gh signed in on this computer."

[face]
shape = "cloud"
color = "#8b5cf6"

[routine]
title = "Review the new PR"
trigger = "webhook"
when = "github:pull_request.opened"
prompt = "Use the skill revisar-pr with the event's pull request: read its diff and say what it changes and what risks it has. Do not run its code or post anything."
