# A bot template: what «Desde plantilla» makes. Its folder's name is its skill's name.
name = "Mail summary at 07:00"
start = "Every day at 07:00 I summarise your mail of the last 24 hours, without opening it or marking it as read. I read Gmail with NeoBot's browser: tell me «open the mail» to sign in there once. If you use another mail service, tell me its web address."

[face]
shape = "pill"
color = "#3b82f6"

[routine]
title = "Mail summary"
trigger = "schedule"
days = "daily"
at = "07:00"
prompt = "Use the skill resumen-correo: read the inbox with NeoBot's browser and summarise what arrived in the last 24 hours, first what asks something of the owner. Do not open or change any message."
