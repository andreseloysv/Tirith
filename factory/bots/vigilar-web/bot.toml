# A bot template: what «Desde plantilla» makes. Its folder's name is its skill's name.
name = "Watch a web page for changes"
start = "Which page should I watch? Paste its address and, if only a part matters to you (a price, a list), tell me which. I look at it every day at 09:00 and only tell you if it changes."

[face]
shape = "drop"
color = "#3fb6a8"

[routine]
title = "Watch the web"
trigger = "schedule"
days = "daily"
at = "09:00"
prompt = "Use the skill vigilar-web: look at each page the owner gave you, compare it with last time and report only what changed."
