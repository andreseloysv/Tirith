name: app

# Desktop bundles on version tags. macOS is signed (and notarized) when the secrets in app/README.md
# exist; otherwise everything is unsigned.
on:
  push:
    tags:
      - "v*"
  workflow_dispatch:
    inputs:
      version:
        description: "Version the daemon inside says (empty: the crate's)"
        required: false
        default: ""
      agents:
        description: "The guide's catalog overlay (TOML, release.sh's TIRITH_AGENTS_FILE), or empty"
        required: false
        default: ""

permissions:
  contents: read

jobs:
  bundle:
    name: bundle (${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        os: [macos-latest, windows-latest, ubuntu-22.04]
    runs-on: ${{ matrix.os }}
    env:
      APPLE_CERTIFICATE: ${{ secrets.APPLE_CERTIFICATE }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ runner.os == 'macOS' && 'aarch64-apple-darwin,x86_64-apple-darwin' || '' }}
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: .
      - name: Linux dependencies
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libappindicator3-dev librsvg2-dev libsqlite3-dev patchelf
      - name: Install
        working-directory: app
        run: npm ci
      - name: Import macOS certificate
        if: runner.os == 'macOS' && env.APPLE_CERTIFICATE != ''
        env:
          APPLE_CERTIFICATE_PASSWORD: ${{ secrets.APPLE_CERTIFICATE_PASSWORD }}
          APPLE_SIGNING_IDENTITY: ${{ secrets.APPLE_SIGNING_IDENTITY }}
        run: |
          keychain="$RUNNER_TEMP/build.keychain-db"
          pass=$(uuidgen)
          echo "$APPLE_CERTIFICATE" | base64 --decode > "$RUNNER_TEMP/cert.p12"
          security create-keychain -p "$pass" "$keychain"
          security set-keychain-settings -lut 21600 "$keychain"
          security unlock-keychain -p "$pass" "$keychain"
          security import "$RUNNER_TEMP/cert.p12" -P "$APPLE_CERTIFICATE_PASSWORD" -A -t cert -f pkcs12 -k "$keychain"
          security set-key-partition-list -S apple-tool:,apple: -s -k "$pass" "$keychain"
          security list-keychains -d user -s "$keychain" login.keychain-db
          rm "$RUNNER_TEMP/cert.p12"
      # Writes app/src-tauri/binaries/tirith-<target triple> (universal on macOS, .exe on Windows) for
      # bundle.externalBin. On Windows here, not as beforeBuildCommand: Tauri runs that through cmd, which has no sh.
      - name: Daemon sidecar
        shell: bash
        env:
          WANTED: ${{ inputs.version }}
          AGENTS: ${{ inputs.agents }}
        run: |
          # a daemon to hand out: it carries its page and factory (TIRITH_DIST), its version and the catalog overlay
          export TIRITH_DIST=1
          if [ -n "$WANTED" ]; then export TIRITH_RELEASE="$WANTED"; fi
          if [ -n "$AGENTS" ]; then
            printf '%s\n' "$AGENTS" > "$RUNNER_TEMP/agents.toml"
            export TIRITH_AGENTS_FILE="$RUNNER_TEMP/agents.toml"
          fi
          sh app/sidecar.sh
      - name: Build
        working-directory: app
        env:
          APPLE_SIGNING_IDENTITY: ${{ secrets.APPLE_SIGNING_IDENTITY }}
          APPLE_API_KEY: ${{ secrets.APPLE_API_KEY }}
          APPLE_API_ISSUER: ${{ secrets.APPLE_API_ISSUER }}
          APPLE_API_KEY_CONTENT: ${{ secrets.APPLE_API_KEY_CONTENT }}
          APPLE_ID: ${{ secrets.APPLE_ID }}
          APPLE_PASSWORD: ${{ secrets.APPLE_PASSWORD }}
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
        shell: bash
        run: |
          # An absent secret comes as an empty variable, and Tauri signs with any identity it is given, "" too.
          for name in $(compgen -e APPLE_ || true); do
            [ -n "${!name}" ] || unset "$name"
          done
          if [ "$RUNNER_OS" = macOS ] && [ -n "${APPLE_SIGNING_IDENTITY:-}" ]; then
            if [ -n "${APPLE_API_KEY_CONTENT:-}" ]; then
              umask 077
              printf '%s' "$APPLE_API_KEY_CONTENT" > "$RUNNER_TEMP/api_key.p8"
              export APPLE_API_KEY_PATH="$RUNNER_TEMP/api_key.p8"
            fi
            ../scripts/package.sh
          else
            npm run tauri build
          fi
      - uses: actions/upload-artifact@v4
        with:
          name: tirith-${{ runner.os }}
          if-no-files-found: error
          path: |
            target/release/bundle/dmg/*.dmg
            target/release/bundle/macos/*.app
            target/release/bundle/msi/*.msi
            target/release/bundle/nsis/*.exe
            target/release/bundle/deb/*.deb
            target/release/bundle/rpm/*.rpm
            target/release/bundle/appimage/*.AppImage
