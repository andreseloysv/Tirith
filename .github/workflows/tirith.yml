name: tirith

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  daemon:
    name: daemon
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy
      - uses: Swatinem/rust-cache@v2
      - name: Build and lint
        run: cargo build -q -p tirith && cargo clippy -q -p tirith -- -D warnings
      - name: Small files
        run: sh tools/size.sh

  windows:
    name: windows
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy
      - uses: Swatinem/rust-cache@v2
      - name: Build and lint
        run: cargo build -q -p tirith && cargo clippy -q -p tirith -- -D warnings
      # As a release is built: the page then comes from the binary's own copy, not from this checkout.
      - name: Build as handed out
        env:
          TIRITH_DIST: "1"
        run: cargo build -q -p tirith
      - name: The daemon serves its page and answers
        shell: pwsh
        run: ./scripts/checks/windows-smoke.ps1
