name: tirith

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  daemon:
    name: daemon
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy
      - uses: Swatinem/rust-cache@v2
      - name: Build and lint
        run: cargo build -q -p tirith && cargo clippy -q -p tirith -- -D warnings
      - name: Size limit
        run: |
          n=$(find rust/tirith/src -name '*.rs' -exec cat {} + | wc -l)
          echo "rust/tirith/src: $n lines (limit 6000)"
          test "$n" -le 6000
