name: windows-install

# Does a release install and run on a fresh Windows machine? Run by hand with the tag to test. No secrets: real
# sign-ins stay out of CI (rotating tokens would break the owner's logins); a fake agent proves a lane.
on:
  workflow_dispatch:
    inputs:
      tag:
        description: Release tag to test (for example v0.2.2-rc.1)
        required: true

permissions:
  contents: read

jobs:
  install:
    runs-on: windows-latest
    timeout-minutes: 30
    defaults:
      run:
        shell: pwsh
    env:
      TIRITH_BASE_URL: https://github.com/andreseloysv/Tirith/releases/download/${{ inputs.tag }}
      TIRITH_PORT: "7717"
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: Throwaway profile
        run: |
          $p = Join-Path $env:RUNNER_TEMP 'profile'
          New-Item -ItemType Directory -Force "$p\AppData\Roaming", "$p\AppData\Local", "$p\logs" | Out-Null
          @("USERPROFILE=$p", "HOME=$p", "TIRITH_HOME=$p\.tirith", "APPDATA=$p\AppData\Roaming",
            "LOCALAPPDATA=$p\AppData\Local", "LOGS=$p\logs") | Add-Content $env:GITHUB_ENV
          git config --global user.name ci; git config --global user.email ci@localhost
      - name: Install OpenBot
        run: |
          & ([scriptblock]::Create((irm "$env:TIRITH_BASE_URL/install.ps1"))) -NoSetup 2>&1 | Tee-Object "$env:LOGS\install.log"
          "$env:USERPROFILE\.local\bin" | Add-Content $env:GITHUB_PATH
      - name: Version and doctor
        run: |
          tirith --version | Tee-Object "$env:LOGS\version.log"
          tirith doctor *>&1 | Tee-Object "$env:LOGS\doctor.log"
        continue-on-error: true
      - name: Install the agents their makers' way
        continue-on-error: true
        run: |
          $n = 'clau' + 'de'  # built at run time: the repo's hooks refuse the word
          $run = { param($name, $block) "== $name"; try { & $block } catch { "FAILED $name : $_" } }
          & $run $n { irm "https://$n.ai/install.ps1" | iex }
          & $run 'codex' { powershell -ExecutionPolicy ByPass -c "irm https://chatgpt.com/codex/install.ps1 | iex" }
          & $run 'muse' { irm https://dev.meta.ai/install.ps1 | iex }
          & $run 'copilot' { npm install -g '@github/copilot' }
          # the installers edit the user's PATH, which this step's process does not see
          $all = [Environment]::GetEnvironmentVariable('Path','Machine') + ';' + [Environment]::GetEnvironmentVariable('Path','User')
          "PATH=$all;$env:APPDATA\npm;$env:LOCALAPPDATA\Programs\muse" | Add-Content $env:GITHUB_ENV
          Get-Command $n, codex, muse, copilot -ErrorAction Continue | Format-Table Name, Source | Out-String | Tee-Object "$env:LOGS\agents.log"
      - name: tirith setup finds them
        run: |
          tirith setup --yes --agents anthropic,codex,copilot,muse *>&1 | Tee-Object "$env:LOGS\setup.log"
          $text = Get-Content "$env:LOGS\setup.log" -Raw
          $bad = 'codex', 'copilot', 'muse' | Where-Object { $text -notmatch "(?s)==[^\n]*\n\s*found .*$_" }
          if ($bad) { throw "setup did not find: $bad" }
          foreach ($f in "$env:USERPROFILE\.codex\hooks.json", "$env:USERPROFILE\.copilot\hooks\tirith.json") {
            if (-not (Select-String -Path $f -Pattern 'tirith' -Quiet)) { throw "no OpenBot hook in $f" }
          }
      - name: Serve with a fake agent
        run: |
          $fake = "$env:RUNNER_TEMP\fake.cmd"
          "@node `"$PWD\tools\e2e\fake-agent.mjs`" %*" | Set-Content $fake -Encoding ascii
          $f = $fake -replace '\\', '/'
          @"

          [agents.fake]
          command = "$f"
          args = ["-p", "brief"]
          chat_args = []
          [autopilot]
          enabled = false
          [merge]
          push = false
          [messenger]
          url = "http://127.0.0.1:9"
          "@ | Add-Content "$env:TIRITH_HOME\config.toml"
          Start-Process tirith -ArgumentList serve -RedirectStandardOutput "$env:LOGS\serve.out" -RedirectStandardError "$env:LOGS\serve.err" -WindowStyle Hidden
          # up when it answers at all: before a sign-in the page says 403
          $up = $false
          foreach ($i in 1..120) {
            try { Invoke-WebRequest "http://127.0.0.1:7717/" -UseBasicParsing -TimeoutSec 2 -SkipHttpErrorCheck | Out-Null; $up = $true; break }
            catch { Start-Sleep -Milliseconds 500 }
          }
          if (-not $up) { throw 'the daemon did not answer on 7717' }
          tirith status
          $link = "$(tirith open link | Select-Object -Last 1)".Trim()
          Invoke-WebRequest -UseBasicParsing $link -SessionVariable signedIn | Out-Null
          $page = Invoke-WebRequest -UseBasicParsing "http://127.0.0.1:7717/" -WebSession $signedIn
          if ($page.Content -notmatch '<title>OpenBot</title>') { throw 'the sign-in link did not open the page' }
      - name: One lane with the fake agent
        run: |
          $repo = Join-Path $env:RUNNER_TEMP 'demo'
          git init -q -b main $repo; Set-Location $repo
          # the plan lives in docs/TODO.md and must exist; its first step is made by the command
          New-Item -ItemType Directory docs | Out-Null
          "# Plan`n" | Set-Content docs/TODO.md
          'hello' | Set-Content a.txt; git add .; git commit -q -m first
          $out = tirith project add $repo; $out
          $id = ("$($out | Select-Object -First 1)" -split ':')[0]
          tirith plan step $id 1 'Windows check'
          tirith plan add $id 1 'let the fake agent commit a file'
          # it prints "<lane> <status> — <item>"
          $started = "$(tirith lane start $id 1 'let the fake agent commit a file' --agent fake)"; $started
          $lane = ($started -split ' ')[0]
          foreach ($i in 1..60) {
            $log = tirith lane log $lane | Out-String
            if ($log -match 'fake-agent: committed') { break }; Start-Sleep 2
          }
          $log | Tee-Object "$env:LOGS\lane.log"
          if ($log -notmatch 'fake-agent: committed') { throw 'the lane never ran the fake agent' }
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: windows-install-logs
          path: |
            ${{ runner.temp }}/profile/logs
            ${{ runner.temp }}/profile/.tirith/logs
