name: docker

# The server image (scripts/docker/) from a Release's signed assets: no Rust is compiled here. The Dockerfile
# downloads neobot-<target>.tar.gz and checks it against SHA256SUMS and its signature, like scripts/install.sh.
# Pushed to ghcr.io/andreseloysv/neobot:<version>, and as :latest when the Release is not a prerelease.
on:
  release:
    types: [published]
  workflow_dispatch:
    inputs:
      tag:
        description: "The Release to build the image from (e.g. v0.2.2)"
        required: true

permissions:
  contents: read
  packages: write

jobs:
  image:
    runs-on: ubuntu-24.04
    env:
      GH_TOKEN: ${{ github.token }}
      TAG: ${{ github.event.release.tag_name || inputs.tag }}
      IMAGE: ghcr.io/andreseloysv/neobot
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: The Release and its Linux assets
        id: rel
        run: |
          json=$(gh release view "$TAG" --repo "$GITHUB_REPOSITORY" --json assets,isPrerelease)
          for t in x86_64 aarch64; do
            jq -e --arg a "neobot-$t-unknown-linux-musl.tar.gz" 'any(.assets[]; .name == $a)' <<< "$json" > /dev/null ||
              { echo "$TAG has no neobot-$t-unknown-linux-musl.tar.gz" >&2; exit 1; }
          done
          tags="$IMAGE:${TAG#v}"
          [ "$(jq -r .isPrerelease <<< "$json")" = true ] || tags="$tags,$IMAGE:latest"
          echo "version=${TAG#v}" >> "$GITHUB_OUTPUT"
          echo "tags=$tags" >> "$GITHUB_OUTPUT"
      - uses: docker/setup-qemu-action@v3
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - uses: docker/build-push-action@v6
        id: push
        with:
          context: .
          file: scripts/docker/Dockerfile
          platforms: linux/amd64,linux/arm64
          push: true
          tags: ${{ steps.rel.outputs.tags }}
          build-args: NEOBOT_VERSION=${{ steps.rel.outputs.version }}
          labels: |
            org.opencontainers.image.source=https://github.com/${{ github.repository }}
            org.opencontainers.image.version=${{ steps.rel.outputs.version }}
      - name: Digest
        run: echo "${{ steps.push.outputs.digest }} ${{ steps.rel.outputs.tags }}" >> "$GITHUB_STEP_SUMMARY"
