[package]
name = "tirith-core"
version = "0.1.0"
description = "Tirith core: home, config, stores, roadmap and state types shared by the CLI and the desktop app"
edition = "2021"
license = "MIT"

[dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"
toml = { version = "0.8", features = ["preserve_order"] }
regex = "1"
sha1 = "0.10"
chrono = { version = "0.4", default-features = false, features = ["clock", "std"] }

[dev-dependencies]
tempfile = "3"
