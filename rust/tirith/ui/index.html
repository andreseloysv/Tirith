<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Tirith</title>
<style>
:root{--bg:#f6f4ef;--panel:#fff;--ink:#1d1c1a;--mute:#76716a;--line:#e4e0d8;--acc:#b8901c;--ok:#2f7d5b;--bad:#b4442f;--run:#2f6fb4;--wait:#8a6d1f}
@media (prefers-color-scheme:dark){:root{--bg:#141412;--panel:#1d1c1a;--ink:#ece8e1;--mute:#9a948a;--line:#2e2c28;--acc:#d9b442;--ok:#5fb88d;--bad:#e0735e;--run:#6fa6e6;--wait:#d2b25a}}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--ink);font:14px/1.45 -apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif}
header{display:flex;gap:16px;align-items:center;padding:10px 16px;border-bottom:1px solid var(--line)}
header b{font-size:16px;letter-spacing:.5px}
#conn{width:9px;height:9px;border-radius:50%;background:var(--bad)}#conn.on{background:var(--ok)}
#load{color:var(--mute);margin-left:auto}
main{display:grid;grid-template-columns:minmax(320px,38%) 1fr;height:calc(100vh - 45px)}
section{overflow:auto;padding:12px 16px}
#left{display:flex;flex-direction:column;border-right:1px solid var(--line);padding:0}
#chat{flex:1;overflow:auto;padding:12px 16px;display:flex;flex-direction:column;gap:8px}
.m{max-width:92%;white-space:pre-wrap;word-wrap:break-word;padding:8px 11px;border-radius:10px;background:var(--panel);border:1px solid var(--line)}
.m.owner{align-self:flex-end;background:var(--acc);color:#111;border:0}
.m.tool{font:12px ui-monospace,Menlo,monospace;color:var(--mute);background:none;border:0;padding:0 4px}
.m.tirith{font-size:12px;color:var(--wait);background:none;border-left:3px solid var(--wait);border-radius:0}
#busy{color:var(--mute);font-size:12px;padding:0 16px;min-height:18px}
form#say{display:flex;gap:8px;padding:10px 16px;border-top:1px solid var(--line)}
textarea,input,select,button{font:inherit;color:inherit;background:var(--panel);border:1px solid var(--line);border-radius:8px;padding:7px 9px}
textarea{flex:1;resize:none;height:62px}
button{cursor:pointer}button.pri{background:var(--acc);color:#111;border:0}
h2{font-size:12px;text-transform:uppercase;letter-spacing:1px;color:var(--mute);margin:18px 0 8px}h2:first-child{margin-top:4px}
.lane{border:1px solid var(--line);background:var(--panel);border-radius:10px;padding:9px 11px;margin-bottom:8px}
.lane .top{display:flex;gap:8px;align-items:center}.lane .id{font:12px ui-monospace,Menlo,monospace;color:var(--mute)}
.lane .note{color:var(--mute);font-size:12px;margin-top:3px;white-space:pre-wrap}
.lane button{margin-left:auto;padding:2px 8px;font-size:12px}.lane button+button{margin-left:4px}
.b{font-size:11px;padding:1px 7px;border-radius:9px;border:1px solid currentColor;white-space:nowrap}
.running,.merging{color:var(--run)}.queued,.merge-queued{color:var(--wait)}.merged,.passed{color:var(--ok)}
.failed,.no-report,.blocked,.timeout,.stopped,.partial{color:var(--bad)}
.step{margin-bottom:10px}.step summary{cursor:pointer;font-weight:600}.step .count{color:var(--mute);font-weight:400}
.item{display:flex;gap:8px;align-items:baseline;padding:3px 0 3px 14px}.item span.t{flex:1}
.item button{padding:1px 8px;font-size:12px}
.add{display:flex;gap:6px;padding:4px 0 4px 14px}.add input{flex:1}
#events div{font-size:12px;padding:2px 0;border-bottom:1px dashed var(--line);display:flex;gap:8px}
#events .at{color:var(--mute);font-family:ui-monospace,Menlo,monospace}#events .blocked{color:var(--bad)}
#events .who{color:var(--mute);max-width:180px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
#runs div{font-size:12px;padding:2px 0}
#modal{position:fixed;inset:5%;background:var(--panel);border:1px solid var(--line);border-radius:10px;display:none;flex-direction:column}
#modal pre{flex:1;overflow:auto;margin:0;padding:12px;font:12px ui-monospace,Menlo,monospace;white-space:pre-wrap}
#modal.on{display:flex}#modal header{border:0}
.quiet{color:var(--mute)}
@media (max-width:820px){main{grid-template-columns:1fr;height:auto}#left{height:70vh;border-right:0;border-bottom:1px solid var(--line)}}
</style>
</head>
<body>
<header><b>Tirith</b><span id="conn" title="conexión"></span><span id="load"></span></header>
<main>
  <div id="left">
    <div id="chat"></div>
    <div id="busy"></div>
    <form id="say"><textarea id="text" placeholder="Escribe al manager… (Enter envía, Shift+Enter salto de línea)"></textarea><button class="pri">Enviar</button></form>
  </div>
  <section>
    <h2>Trabajando</h2><div id="active"></div>
    <h2>Plan <select id="proj"></select></h2><div id="plan" class="quiet">Elige un proyecto.</div>
    <h2>Checks</h2><div id="runs"></div>
    <h2>Terminadas</h2><div id="ended"></div>
    <h2>Actividad</h2><div id="events"></div>
  </section>
</main>
<div id="modal"><header><b id="mtitle"></b><button style="margin-left:auto" onclick="modal.classList.remove('on')">Cerrar</button></header><pre id="mbody"></pre></div>
<script>
const S = {lanes: {}, runs: {}, project: (() => { try { return localStorage.getItem("tirith.project") || ""; } catch { return ""; } })()};
const $ = id => document.getElementById(id);
const esc = s => String(s ?? '').replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const ACTIVE = ['queued', 'running', 'merge-queued', 'merging'];
const LABEL = {queued:'en cola', running:'trabajando', 'merge-queued':'esperando merge', merging:'checks', merged:'en main',
  failed:'falló', 'no-report':'sin reporte', partial:'parcial', blocked:'bloqueada', stopped:'parada', passed:'ok', timeout:'tiempo'};
async function api(method, path, body) {
  const r = await fetch(path, {method, headers: {'Content-Type': 'application/json'}, body: body ? JSON.stringify(body) : undefined});
  const t = await r.text();
  if (!r.ok) { alert(t); throw new Error(t); }
  try { return JSON.parse(t); } catch { return t; }
}
function time(at) { return at ? new Date(at).toLocaleTimeString([], {hour: '2-digit', minute: '2-digit'}) : ''; }

function addChat(m) {
  const el = document.createElement('div');
  el.className = 'm ' + m.role;
  el.textContent = m.text;
  const box = $('chat'), stick = box.scrollHeight - box.scrollTop - box.clientHeight < 80;
  box.appendChild(el);
  if (stick) box.scrollTop = box.scrollHeight;
}
function laneHtml(l) {
  const act = ACTIVE.includes(l.status);
  return `<div class="top"><span class="b ${esc(l.status)}">${esc(LABEL[l.status] || l.status)}</span>
    <span class="id">${esc(l.project)}:${esc(l.step)} · ${esc(l.id)}</span>
    <button data-log="${esc(l.id)}">log</button>${act ? `<button data-stop="${esc(l.id)}">parar</button>` : ''}</div>
    <div>${esc(l.item)}</div>
    ${(l.report && l.report.note) || l.note ? `<div class="note">${esc((l.report && l.report.note) || l.note)}</div>` : ''}`;
}
function renderLane(l) {
  let el = document.getElementById('lane-' + l.id);
  if (!el) { el = document.createElement('div'); el.id = 'lane-' + l.id; el.className = 'lane'; }
  el.innerHTML = laneHtml(l);
  const box = ACTIVE.includes(l.status) ? $('active') : $('ended');
  if (el.parentNode !== box) box.prepend(el);
  if (!$('active').children.length) $('active').innerHTML = '<div class="quiet" id="none">Ninguna lane trabajando.</div>';
  else if ($('none') && $('active').children.length > 1) $('none').remove();
  while ($('ended').children.length > 30) $('ended').lastChild.remove();
}
function addEvent(e) {
  const el = document.createElement('div');
  el.innerHTML = `<span class="at">${time(e.at)}</span><span class="who">${esc(e.lane || e.project || '')}</span><span class="${esc(e.kind)}">${esc(e.summary || e.kind)}</span>`;
  $('events').prepend(el);
  while ($('events').children.length > 200) $('events').lastChild.remove();
}
function renderRuns() {
  const runs = Object.values(S.runs).sort((a, b) => b.id - a.id).slice(0, 12);
  $('runs').innerHTML = runs.map(r => `<div><span class="b ${esc(r.status)}">${esc(LABEL[r.status] || r.status)}</span> ${esc(r.stage)} · <span class="quiet">${esc(r.lane)}</span></div>`).join('') || '<div class="quiet">Ningún check todavía.</div>';
}
async function loadPlan() {
  if (!S.project) return;
  const p = await api('GET', '/api/plan/' + encodeURIComponent(S.project));
  const open = {};
  document.querySelectorAll('#plan details[open]').forEach(d => open[d.dataset.step] = 1);
  $('plan').classList.remove('quiet');
  $('plan').innerHTML = p.steps.map(st => {
    const todo = st.items.filter(i => !i.done);
    const items = todo.map(i => `<div class="item"><span class="t">${esc(i.text)}</span>${i.lane && ACTIVE.includes(i.lane.status)
      ? `<span class="b ${esc(i.lane.status)}">${esc(LABEL[i.lane.status])}</span>`
      : `<button data-start="${esc(st.num)}" data-item="${esc(i.text)}">empezar</button>`}</div>`).join('');
    return `<details class="step" data-step="${esc(st.num)}" ${open[st.num] || (todo.length && Object.keys(open).length === 0 && st === p.steps.find(s => s.items.some(i => !i.done))) ? 'open' : ''}>
      <summary>${esc(st.num)}. ${esc(st.title)} <span class="count">${todo.length} abiertos · ${st.items.length - todo.length} hechos</span></summary>
      ${items}<form class="add" data-step="${esc(st.num)}"><input placeholder="Nuevo ítem para el paso ${esc(st.num)}"><button>añadir</button></form></details>`;
  }).join('') || '<div class="quiet">El plan no tiene pasos.</div>';
}

let es;
async function boot() {
  const s = await api('GET', '/api/state');
  $('chat').innerHTML = ''; $('active').innerHTML = ''; $('ended').innerHTML = ''; $('events').innerHTML = '';
  s.chat.forEach(addChat);
  s.lanes.sort((a, b) => (a.created_at || '').localeCompare(b.created_at || '')).forEach(l => { S.lanes[l.id] = l; renderLane(l); });
  if (!$('active').children.length) $('active').innerHTML = '<div class="quiet" id="none">Ninguna lane trabajando.</div>';
  s.events.forEach(addEvent);
  S.runs = {}; s.runs.forEach(r => S.runs[r.id] = r); renderRuns();
  $('proj').innerHTML = '<option value="">—</option>' + s.projects.map(p => `<option value="${esc(p.id)}">${esc(p.name || p.id)}</option>`).join('');
  $('proj').value = S.project; loadPlan();
  es && es.close();
  es = new EventSource('/api/stream');
  es.onopen = () => $('conn').classList.add('on');
  es.onerror = () => { $('conn').classList.remove('on'); es.close(); setTimeout(boot, 2000); };
  es.onmessage = e => {
    const m = JSON.parse(e.data), d = m.d;
    if (m.t === 'lane') { S.lanes[d.id] = d; renderLane(d); if (d.project === S.project) loadPlan(); }
    else if (m.t === 'event') addEvent(d);
    else if (m.t === 'chat') addChat(d);
    else if (m.t === 'busy') $('busy').textContent = d ? 'El manager está trabajando…' : '';
    else if (m.t === 'run') { S.runs[d.id] = d; renderRuns(); }
    else if (m.t === 'plan' && d.project === S.project) loadPlan();
    else if (m.t === 'load') $('load').textContent = `carga ${d.load} por núcleo · ${d.running}/${d.max} lanes`;
    (T.handlers[m.t] || []).forEach(fn => { try { fn(d); } catch (err) { console.error(err); } });
  };
}

document.addEventListener('click', async e => {
  const t = e.target;
  if (t.dataset.stop) await api('POST', `/api/lanes/${t.dataset.stop}/stop`);
  if (t.dataset.log) {
    $('mtitle').textContent = t.dataset.log; $('mbody').textContent = await api('GET', `/api/lanes/${t.dataset.log}/log`) || '(vacío)';
    $('modal').classList.add('on');
  }
  if (t.dataset.start) { t.disabled = true; await api('POST', '/api/lanes', {project: S.project, step: t.dataset.start, item: t.dataset.item}).catch(() => t.disabled = false); }
});
document.addEventListener('submit', async e => {
  e.preventDefault();
  const f = e.target;
  if (f.id === 'say') {
    const text = $('text').value.trim();
    if (text) { $('text').value = ''; await api('POST', '/api/chat', {text}); }
  } else if (f.classList.contains('add')) {
    const input = f.querySelector('input'), text = input.value.trim();
    if (text) { await api('POST', '/api/plan/' + encodeURIComponent(S.project), {step: f.dataset.step, text}); input.value = ''; }
  }
});
$('text').addEventListener('keydown', e => { if (e.key === 'Enter' && !e.shiftKey) { e.preventDefault(); $('say').requestSubmit(); } });
$('proj').addEventListener('change', e => { S.project = e.target.value; try { localStorage.setItem('tirith.project', S.project); } catch {} loadPlan(); });
const modal = $('modal');
// For the module scripts (/ui/<module>.js): T.on(type, fn) gets the stream's changes of that type;
// T.section(id, title) returns a new section of the right column; T.api, T.esc, T.time, T.state() are shared.
window.T = {
  handlers: {}, api, esc, time, state: () => S,
  on(type, fn) { (this.handlers[type] = this.handlers[type] || []).push(fn); },
  section(id, title) {
    let box = document.getElementById(id);
    if (box) return box;
    const h = document.createElement("h2"); h.textContent = title;
    box = document.createElement("div"); box.id = id;
    const right = document.querySelector("main > section");
    right.appendChild(h); right.appendChild(box);
    return box;
  },
};
boot();
</script>
<script src="/ui/pipelines.js"></script>
<script src="/ui/health.js"></script>
<script src="/ui/rooms.js"></script>
<script src="/ui/net.js"></script>
<script src="/ui/models.js"></script>
<script src="/ui/attach.js"></script>
<script src="/ui/guard.js"></script>
</body>
</html>
