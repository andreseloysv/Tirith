[package]
name = "tirith"
version = "0.2.1"
description = "NeoBot: one resident process that runs coding agents from a plan, enforces rules and merges verified work"
edition = "2021"
license = "MIT"

[[bin]]
name = "neobot"
path = "src/main.rs"

[dependencies]
axum = { version = "0.8", default-features = false, features = ["http1", "json", "tokio", "query"] }
tokio = { version = "1", features = ["rt-multi-thread", "macros", "process", "io-util", "sync", "time", "net", "fs"] }
tokio-stream = { version = "0.1", features = ["sync"] }
rusqlite = { version = "0.37", features = ["bundled"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
toml = "0.8"
toml_edit = "0.22"
regex = "1"
libc = "0.2"
chrono = { version = "0.4", default-features = false, features = ["clock"] }
reqwest = { version = "0.12", default-features = false, features = ["json", "rustls-tls"] }
base64 = "0.22"
sha2 = "0.10"
rand = "0.8"
ed25519-dalek = "2"
crypto_box = { version = "0.9", default-features = false, features = ["salsa20", "alloc"] }
crypto_secretbox = { version = "0.1", default-features = false, features = ["salsa20", "alloc"] }
qrcode = { version = "0.14", default-features = false, features = ["svg"] }

# The bots' secrets in the system's credential store, called in-process. On Linux in pure Rust, so the binary stays static.
[target.'cfg(target_os = "macos")'.dependencies]
keyring = { version = "3.6.3", default-features = false, features = ["apple-native"] }

[target.'cfg(target_os = "linux")'.dependencies]
keyring = { version = "3.6.3", default-features = false, features = ["async-secret-service", "tokio", "crypto-rust"] }

[target.'cfg(target_os = "windows")'.dependencies]
keyring = { version = "3.6.3", default-features = false, features = ["windows-native"] }
# What Windows does in place of Unix calls (`src/os/`): process ends, the console's echo, free disk space.
windows-sys = { version = "0.61", features = ["Wdk_System_Threading", "Win32_Foundation", "Win32_Storage_FileSystem", "Win32_System_Console", "Win32_System_Diagnostics_Debug", "Win32_System_Threading"] }
