[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "tirith-collector"
version = "0.1.0"
description = "Tirith collector: the tirith CLI, state collector and Spark brain"
readme = "README.md"
requires-python = ">=3.12"
license = { text = "MIT" }
dependencies = []

[project.scripts]
tirith = "tirith.cli:main"

[dependency-groups]
dev = [
    "pytest>=8",
    "jsonschema>=4.20",
    "pytest-xdist>=3.8.0",
]

[tool.setuptools]
py-modules = ["tirith_guard"]
packages = ["tirith"]

[tool.uv]
package = true

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
# `slow` marks the tests that cost more than ~10 s even alone (300-lane collector warm-ups, cycle budgets).
# They stay in the default run: with `-n auto --maxprocesses 8` the whole suite is under the 240 s target.
# Skip them for a quick local pass: `pytest -m "not slow"`.
markers = ["slow: costs more than ~10 s even alone; included in the default run"]
tmp_path_retention_policy = "failed"  # passing tests leave no temp folders behind
